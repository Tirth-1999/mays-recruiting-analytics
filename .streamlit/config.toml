[theme]
# Texas A&M Mays Business School colors
primaryColor = "#500000"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
# Port is set to 8501 for Streamlit Cloud compatibility
# Streamlit Cloud always uses 8501 internally regardless of config
# For local development, you can change this to 8502 if needed
port = 8501

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
